version: 2
updates:
  # Root npm workspace (desktop app, local server, client).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Trystero is pre-1.0, so its minor versions break the WebRTC sync API.
      # Upgrade it by hand as a tested change instead.
      - dependency-name: "@trystero-p2p/*"
        update-types: ["version-update:semver-minor"]
  # The relay has its own package.json and lockfile (not part of the workspace).
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The relay image's Node base (relay/Dockerfile).
  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
